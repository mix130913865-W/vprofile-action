apiVersion: v1
kind: Service
metadata:
  name: vprodb                 # Service name，用於 cluster internal DNS 存取
                               
spec:
  type: ClusterIP              # Service type：僅限cluster內部存取

  ports:
  - port: 3306                 # Service port（MySQL default port）
    targetPort: vprodb-port    # Target port inside Pod（named port）
                               # Pod 需定義對應的 port name
    protocol: TCP              # MySQL uses TCP protocol

  selector:
    app: vprodb                # 將流量導向 label app=vprodb 的 Pod
