apiVersion: v1
kind: Service
metadata:
  name: vprocache01             # Service 名稱，用於 cluster 內部 DNS 存取

spec:
  type: ClusterIP               # Service type：僅限 Kubernetes cluster內部使用
                                # Cache service 不需要對外暴露

  ports:
  - port: 11211                 # Service port（Memcached default port）
    targetPort: vpromc-port     # Pod 內實際接收流量的 port（named port）
                                # Pod 需定義對應的 port name
    protocol: TCP               # Memcached 使用 TCP（也可支援 UDP，但常用 TCP）

  selector:
    app: vpromc                 # 將流量轉發到 label app=vpromc 的 Pod
