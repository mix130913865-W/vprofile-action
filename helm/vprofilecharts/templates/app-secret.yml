apiVersion: v1
# 使用 Kubernetes core API 的 v1 版本

kind: Secret
# 資源種類為 Secret，用來儲存敏感資訊（password、token 等）

metadata:
  name: app-secret
  # Secret 的名稱，Pod / Deployment 會用這個 name 來引用

type: Opaque
# Opaque 表示一般用途的 Secret
# Kubernetes 不會對內容做任何語意解讀，只負責儲存

data:
  db-pass: dnByb2RicGFzcw==
  # 資料庫密碼（value 為 base64 編碼）
  # 實際明文需先 base64 encode 才能放在 data 欄位

  rmq-pass: Z3Vlc3Q=
  # RabbitMQ 密碼（base64 編碼）
